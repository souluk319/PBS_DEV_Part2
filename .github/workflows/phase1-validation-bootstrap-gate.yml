name: Phase 1 Validation Bootstrap Gate

on:
  pull_request:
    paths:
      - ".github/workflows/phase1-validation-bootstrap-gate.yml"
      - "docs/integration/**"
      - "src/**"
      - "tests/**"
      - "data/**"
      - "manifests/**"
      - "reports/build_logs/**"
      - "pyproject.toml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/phase1-validation-bootstrap-gate.yml"
      - "docs/integration/**"
      - "src/**"
      - "tests/**"
      - "data/**"
      - "manifests/**"
      - "reports/build_logs/**"
      - "pyproject.toml"

concurrency:
  group: phase1-validation-bootstrap-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase1-bootstrap-gate:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Validate tracked integration artifacts
        run: |
          @'
          import json
          from pathlib import Path

          root = Path.cwd()

          doc_paths = [
              root / "docs" / "integration" / "corpus_truth_contract.md",
              root / "docs" / "integration" / "backend_absorption_order.md",
              root / "docs" / "integration" / "phase1_validation_bootstrap_gate.md",
          ]
          for path in doc_paths:
              if not path.exists():
                  raise SystemExit(f"missing integration artifact: {path}")
              text = path.read_text(encoding="utf-8")
              if "## Goal" not in text:
                  raise SystemExit(f"missing goal section: {path}")

          runtime_truth = json.loads(
              (root / "reports" / "build_logs" / "runtime_truth_freeze_report.json").read_text(encoding="utf-8")
          )
          if runtime_truth.get("status") != "ok":
              raise SystemExit("runtime truth freeze report is not ok")
          metrics = runtime_truth.get("metrics") or {}
          if metrics.get("canonical_truth_owner_count_per_book") != 1:
              raise SystemExit("runtime truth owner count per book drifted")
          if metrics.get("one_click_rebuild_exit_code") != 0:
              raise SystemExit("one-click rebuild exit code is non-zero")
          if metrics.get("post_switch_smoke_exit_code") != 0:
              raise SystemExit("post-switch smoke exit code is non-zero")

          citation_gate = json.loads(
              (root / "reports" / "build_logs" / "citation_grounding_gate_report.json").read_text(encoding="utf-8")
          )
          if citation_gate.get("status") != "ok":
              raise SystemExit("citation grounding gate report is not ok")
          if citation_gate.get("broken_citation_count") != 0:
              raise SystemExit("broken citations detected")
          if citation_gate.get("viewer_anchor_mismatch_count") != 0:
              raise SystemExit("viewer anchor mismatches detected")

          corpus_rebuild = json.loads(
              (root / "reports" / "build_logs" / "active_gold_corpus_rebuild_report.json").read_text(encoding="utf-8")
          )
          chunk_count = int(corpus_rebuild.get("chunk_count") or 0)
          upserted_count = int(corpus_rebuild.get("qdrant_upserted_count") or 0)
          if chunk_count <= 0:
              raise SystemExit("corpus rebuild chunk count is empty")
          if upserted_count != chunk_count:
              raise SystemExit("qdrant upsert count does not match chunk count")

          one_click_report = json.loads(
              (root / "reports" / "build_logs" / "ocp420_one_click_runtime_report.json").read_text(encoding="utf-8")
          )
          step_ids = [str(item.get("step_id") or "") for item in one_click_report.get("step_results") or []]
          required_steps = {
              "quarantine_old_full_rebuild_outputs",
              "materialize_full_rebuild_books",
              "activate_full_rebuild_runtime",
              "generate_full_rebuild_wiki_relations",
          }
          if not required_steps.issubset(set(step_ids)):
              raise SystemExit(f"missing one-click step ids: expected {sorted(required_steps)} got {step_ids}")

          print("phase-1 integration artifacts and evidence are present")
          '@ | python -

      - name: Run phase-1 bootstrap pytest subset
        env:
          PYTHONPATH: src
        run: |
          python -m pytest tests/test_app_server.py tests/test_customer_pack_direct_viewer_route.py tests/test_customer_pack_read_boundary.py tests/test_app_viewers_routes.py -q -k "canonicalize_viewer_path or viewer_document_route_supports_entity_and_figure_paths or viewer_document_route_falls_back_to_normalized_sections_for_known_book or viewer_path_local_raw_html_fallback"
